services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kasir-app
    restart: unless-stopped
    working_dir: /var/www/html
    networks:
      - kasir-network
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: kasir-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kasir-network
    depends_on:
      - app

  database:
    image: mysql:8.0
    container_name: kasir-database
    restart: unless-stopped
    env_file:
      - .env.docker
    networks:
      - kasir-network
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  kasir-network:
    driver: bridge

volumes:
  dbdata:
    driver: local